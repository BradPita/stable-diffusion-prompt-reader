name: Auto Build Executables

on:
  push:
    branches: [ "SimpAI" ]
  workflow_dispatch:  # 允许手动触发，方便测试

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    # 修改处：加了 --onefile，让 Windows 打包成单文件 exe
    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: pyinstaller --onefile --windowed --noconfirm --name "SD Prompt Reader" main.py

    # macOS 保持原样，因为它需要打包成 .app 文件夹
    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: pyinstaller --windowed --noconfirm --name "SD Prompt Reader" main.py

    - name: Zip macOS App
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r "SD-Prompt-Reader-macOS.zip" "SD Prompt Reader.app"

    - name: Upload Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: SD-Prompt-Reader-Windows
        path: "dist/SD Prompt Reader.exe"

    - name: Upload Artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: SD-Prompt-Reader-macOS
        path: "dist/SD-Prompt-Reader-macOS.zip"
