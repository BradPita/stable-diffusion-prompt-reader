name: Auto Build Executables

on:
  push:
    branches: [ "SimpAI" ]
  # 建议加上 workflow_dispatch，这样可以在 GitHub 网页端手动点击运行测试
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: pyinstaller --windowed --noconfirm --name "SD Prompt Reader" main.py

    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: pyinstaller --windowed --noconfirm --name "SD Prompt Reader" main.py

    - name: Zip macOS App
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r "SD-Prompt-Reader-macOS.zip" "SD Prompt Reader.app"

    - name: Upload Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: SD-Prompt-Reader-Windows
        path: "dist/SD Prompt Reader.exe"  # 加了引号，防止空格导致路径找不到

    - name: Upload Artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: SD-Prompt-Reader-macOS
        path: "dist/SD-Prompt-Reader-macOS.zip"
