name: Auto Build Executables

# 触发条件：允许我们在 GitHub 网页上手动点击按钮触发打包
on:
  workflow_dispatch: 

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # 同时启动两台云端电脑：一台最新 Windows，一台最新 macOS
        os: [windows-latest, macos-latest]

    steps:
    # 1. 把你的代码拉取到云端电脑上
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 安装 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. 安装项目依赖库和打包工具 PyInstaller
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    # 4. 在 Windows 上打包
    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: pyinstaller --windowed --noconfirm --name "SD Prompt Reader" main.py

    # 5. 在 macOS 上打包
    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: pyinstaller --windowed --noconfirm --name "SD Prompt Reader" main.py

    # 6. 因为 macOS 的 .app 本质是个文件夹，上传前先压缩成 zip，防止损坏
    - name: Zip macOS App
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r "SD-Prompt-Reader-macOS.zip" "SD Prompt Reader.app"

    # 7. 将 Windows 打包好的 .exe 上传到 GitHub 提供下载
    - name: Upload Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: SD-Prompt-Reader-Windows
        path: dist/SD Prompt Reader.exe

    # 8. 将 macOS 打包好的 .zip 上传到 GitHub 提供下载
    - name: Upload Artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: SD-Prompt-Reader-macOS
        path: dist/SD-Prompt-Reader-macOS.zip
